<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="https://www.youtube.com/iframe_api"></script>
<script>
let player;
function onYouTubeIframeAPIReady(){
  player = new YT.Player('test', {height:'100',width:'100',videoId:'dQw4w9WgXcQ',playerVars:{autoplay:0,controls:0,modestbranding:1,rel:0,origin:window.location.origin,theme:'dark'},events:{onReady:function(){console.log('ready');},onStateChange:function(e){console.log('state',e.data);}}});
}
function play(){player.playVideo();}
function pause(){player.pauseVideo();}
</script>
</head>
<body>
<div id="test"></div>
<button onclick="play()">Play</button>
<button onclick="pause()">Pause</button>
</body>
</html>
